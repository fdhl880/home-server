<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MDN Cloud Storage</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #080808;
            color: #00ff00;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            border: 1px solid #00ff00;
            padding: 30px;
            background: #111;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.2);
        }
        h2, h3 {
            margin-bottom: 20px;
            text-shadow: 0 0 5px rgba(0, 255, 0, 0.5);
        }
        .upload-section {
            border-bottom: 1px dashed #00ff00;
            padding-bottom: 30px;
            margin-bottom: 30px;
        }
        input[type="file"] {
            margin: 20px 0;
            color: #fff;
            background: #222;
            padding: 10px;
            border: 1px solid #333;
            width: 100%;
            cursor: pointer;
        }
        button {
            background-color: #0000ff;
            color: white;
            border: 1px solid #00ff00;
            padding: 10px 20px;
            font-family: inherit;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
        }
        button:hover {
            background-color: #00ff00;
            color: #000;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
        }
        .file-list {
            text-align: left;
            margin-top: 20px;
        }
        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #333;
            padding: 12px;
            margin-bottom: 10px;
            background: #151515;
            transition: all 0.2s ease;
        }
        .file-item:hover {
            border-color: #00ff00;
            background: #1a1a1a;
        }
        .file-info {
            flex-grow: 1;
            margin-right: 15px;
        }
        .file-name {
            font-weight: bold;
            color: #fff;
            word-break: break-all;
        }
        .file-meta {
            font-size: 11px;
            color: #888;
            margin-top: 4px;
        }
        .file-actions a {
            color: #00ff00;
            text-decoration: none;
            margin-right: 15px;
            font-weight: bold;
            border: 1px solid #00ff00;
            padding: 4px 8px;
            font-size: 12px;
        }
        .file-actions a:hover {
            background: #00ff00;
            color: #000;
        }
        .btn-delete {
            background: #ff0000;
            color: #fff;
            border: none;
            padding: 4px 8px;
            font-size: 12px;
            font-family: inherit;
            cursor: pointer;
        }
        .btn-delete:hover {
            background: #ff3333;
            color: #fff;
            box-shadow: 0 0 5px rgba(255,0,0,0.5);
        }
        .no-files {
            color: #666;
            font-style: italic;
            padding: 20px;
            border: 1px dashed #333;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>>> SECURE CLOUD STORAGE <<</h2>
        <p style="margin-bottom: 20px; font-size: 14px; color: #888;">Node: TABLET 2 STORAGE SERVER</p>
        
        <!-- Upload Form -->
        <div class="upload-section">
            <form action="/api/upload" method="POST" enctype="multipart/form-data">
                <input type="file" name="file" required><br>
                <button type="submit">UPLOAD FILE</button>
            </form>
        </div>

        <!-- File List -->
        <div>
            <h3>>> UPLOADED FILES <<</h3>
            <div id="fileContainer" class="file-list">
                <div class="no-files">Loading files...</div>
            </div>
        </div>
    </div>

    <script>
        async function fetchFiles() {
            try {
                const res = await fetch('/api/files');
                const files = await res.json();
                const container = document.getElementById('fileContainer');
                
                if (files.length === 0) {
                    container.innerHTML = '<div class="no-files">No files uploaded yet.</div>';
                    return;
                }
                
                container.innerHTML = files.map(file => `
                    <div class="file-item">
                        <div class="file-info">
                            <div class="file-name">${escapeHtml(file.displayName)}</div>
                            <div class="file-meta">Size: ${file.size} | Uploaded: ${new Date(file.createdAt).toLocaleString()}</div>
                        </div>
                        <div class="file-actions">
                            <a href="/uploads/${encodeURIComponent(file.name)}" target="_blank">VIEW</a>
                            <button class="btn-delete" onclick="deleteFile('${escapeJs(file.name)}')">DELETE</button>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                document.getElementById('fileContainer').innerHTML = '<div class="no-files" style="color: red;">Failed to load files.</div>';
            }
        }

        async function deleteFile(filename) {
            if (!confirm('Are you sure you want to delete this file?')) return;
            try {
                const res = await fetch(`/api/files/${encodeURIComponent(filename)}`, {
                    method: 'DELETE'
                });
                const result = await res.json();
                if (result.success) {
                    fetchFiles();
                } else {
                    alert('Failed to delete file: ' + (result.error || 'Unknown error'));
                }
            } catch (err) {
                alert('Error deleting file: ' + err.message);
            }
        }

        function escapeHtml(text) {
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function escapeJs(text) {
            return text.replace(/'/g, "\\'");
        }

        // Load files list on load
        fetchFiles();
    </script>
</body>
</html>
