<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BLOOMBERG</title>
<link rel="stylesheet" href="css/terminal.css">
</head>
<body>
<div id="app">
  <div id="devbanner">DEV ADAPTER ACTIVE - SYNTHETIC DATA - NOT MARKET DATA</div>
  <header id="top">
    <span class="brand">BLOOMBERG</span>
    <div id="cmdwrap">
      <span id="cmdctx"></span>
      <input id="cmd" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="[SECURITY] [FUNCTION] then GO  (Ctrl+K, F1=HELP)">
      <button id="go">GO</button>
      <div id="ac"></div>
    </div>
    <div id="fkeys"></div>
    <a href="/" style="background:#181818;color:var(--amber);border:1px solid var(--amber);padding:0 6px;text-decoration:none;font-weight:bold;font-size:11px;white-space:nowrap" title="Switch to Single-View PRTU & Order Desk">PRTU DESK</a>
  </header>
  <main id="grid">
    <div class="slot" data-i="0"></div><div class="slot" data-i="1"></div>
    <div class="slot" data-i="2"></div><div class="slot" data-i="3"></div>
    <div class="split" id="vs"></div><div class="split" id="hs"></div>
  </main>
  <footer id="status">
    <span id="msg"></span>
    <span class="prov" id="prov"></span>
    <span id="wsstate"></span>
    <span id="clocks"></span>
    <select id="wsel" title="Workspaces"></select>
  </footer>
  <div id="foot"><span>Unofficial personal clone - not affiliated with Bloomberg L.P.</span><span>Data from public sources; see per-panel source / time / mode badges.</span></div>
</div>
<script src="vendor/lightweight-charts.standalone.production.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
